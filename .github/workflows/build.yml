name: Build XO Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract XO AI.7z
        run: |
          7z x "XO AI.7z" -oextracted
          if [ -d "extracted/XO" ]; then
            cp -a extracted/XO/. .
          else
            cp -a extracted/. .
          fi

      - name: Fix syntax typo in jarvis_service.dart
        run: sed -i 's/if cCmd != null)/if (cCmd != null)/g' lib/services/jarvis_service.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK and Gradle 9.3.1
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> android/local.properties
          mkdir -p android/gradle/wrapper
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip\n' > android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter test || true
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: XO-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
